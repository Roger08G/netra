[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[project]
name = "netra"
version = "1.0.0"
description = "CLI local para el motor de descubrimiento y topología Netra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rich>=15.0.0,<16", "typer>=0.27.2,<1"]
keywords = ["network-discovery", "network-topology", "snmpv3", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Roger08G/netra"
Repository = "https://github.com/Roger08G/netra"
Issues = "https://github.com/Roger08G/netra/issues"
Changelog = "https://github.com/Roger08G/netra/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.6.1,<2", "jsonschema>=4.26.0,<5", "pytest>=9.1.1,<10"]

[project.scripts]
netra = "netra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/netra"]
artifacts = ["cli/src/netra/bin/*"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "netra/schemas"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["cli/tests"]
